name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
          POSTGRES_DB: documind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
      # Verified value for embeddinggemma. Kept here so the schema matches the
      # configured embedding model during CI.
      EMBEDDING_DIMENSION: 768

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff format --check .
          ruff check .

      - name: Apply migrations
        run: python scripts/migrate.py

      - name: Run tests
        run: RUN_DB_TESTS=1 pytest -q
